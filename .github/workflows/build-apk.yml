name: Build Real Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize and Build APK via Bubblewrap
        run: |
          # Non-interactive init using the live manifest
          bubblewrap init --manifest=https://shawon-e1b.pages.dev/manifest.json --directory=twa-project --skipValidation
          cd twa-project
          # Build the release APK
          bubblewrap build --manifest=twa-manifest.json || npm run build || true

      - name: Find and Move APK
        run: |
          mkdir -p final-apk
          find . -name "*.apk" -exec cp {} final-apk/ \;

      - name: Upload Real APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Real-Android-APK
          path: final-apk/*.apk
