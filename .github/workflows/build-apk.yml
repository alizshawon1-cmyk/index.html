name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download and Build WebAPK
        run: |
          npm install -g @bubblewrap/cli
          # Initialize and build project for shawon-e1b.pages.dev
          mkdir -p my-android-app
          cd my-android-app
          
          # Creating a webview android project package
          echo '{
            "packageId": "com.shawontv.app",
            "host": "shawon-e1b.pages.dev",
            "name": "Shawon TV",
            "shortName": "ShawonTV",
            "startUrl": "/",
            "themeColor": "#000000",
            "backgroundColor": "#ffffff",
            "display": "standalone",
            "orientation": "any",
            "shortcuts": [],
            "icons": [],
            "splashScreenArgb": "#ffffff",
            "source": "PWABuilder"
          }' > tva-manifest.json

      - name: Create Dummy APK Artifact for testing
        run: |
          mkdir -p output-apk
          echo "Shawon TV Android App Wrapper" > output-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShawonTV-Real-APK
          path: output-apk/*.apk
