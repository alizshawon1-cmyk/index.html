name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Build APK using Bubblewrap
        run: |
          bubblewrap init --manifest=https://shawon-e1b.pages.dev/manifest.json --directory=android-project || true
          cd android-project || mkdir -p android-project && cd android-project
          # Fallback to direct webview apk builder if init fails
          echo "Building APK..."
