name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Webview Android App
        run: |
          echo "Preparing Android wrapper for https://shawon-e1b.pages.dev/"
          # Creating a simple build structure
          mkdir -p android-app
          echo "<html><head><meta http-equiv='refresh' content='0;url=https://shawon-e1b.pages.dev/'></head><body>Redirecting...</body></html>" > android-app/index.html

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShawonTV-App
          path: android-app/
